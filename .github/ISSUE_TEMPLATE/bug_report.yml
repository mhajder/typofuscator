name: Bug report
description: Something in Typofuscator does not work as expected
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Remove any private or sensitive content from what you paste below.
        For security vulnerabilities, use [private vulnerability reporting](https://github.com/mhajder/typofuscator/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what went wrong or what unexpected behavior you encountered.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the input text and settings configuration (or exported JSON settings) that trigger the issue.
      placeholder: |
        1. Enter text: "..."
        2. Set algorithm to "..."
        3. Observe output: "..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Typofuscator version
      placeholder: e.g. 0.2.0 or Hosted Web App
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Usage mode
      options:
        - Hosted Web App (GitHub Pages)
        - Installed PWA (Offline)
        - Local development (pnpm dev / preview)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 135 on macOS Sonoma / Safari on iOS 18
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Browser Console Log / Error
      description: Copy and paste any errors from your browser developer console (F12 / Inspect -> Console).
      render: text
