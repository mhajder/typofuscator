version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm-dependencies:
        dependency-type: 'production'
      npm-dev-dependencies:
        dependency-type: 'development'
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
